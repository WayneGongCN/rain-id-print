name: 部署 Vercel 生产环境

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: 验证并部署生产环境
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: '1'
      VITE_TELEMETRY_ENABLED: 'true'
    steps:
      - name: 检出 Tag 代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 验证 Tag 对应提交来自 main
        id: release
        run: |
          git fetch origin main
          commit_sha="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          git merge-base --is-ancestor "$commit_sha" origin/main
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
          run_install: false

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行单元测试
        run: pnpm test

      - name: 运行类型检查
        run: pnpm typecheck

      - name: 安装 Vercel CLI
        run: npm install --global vercel@latest

      - name: 拉取生产环境配置
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: 构建生产环境产物
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: 部署生产环境
        run: >-
          vercel deploy --prebuilt --prod
          --token="${{ secrets.VERCEL_TOKEN }}"
          --meta githubDeployment=1
          --meta githubCommitRef=main
          --meta githubCommitSha="${{ steps.release.outputs.commit_sha }}"
          --meta githubCommitOrg="${{ github.repository_owner }}"
          --meta githubCommitRepo="${{ github.event.repository.name }}"
